name: Setup
description: Sets up the job
runs:
  using: composite
  steps:
    - name: Setup Bun
      # No bun-version: setup-bun reads it from `packageManager` in
      # package.json, so the version stays pinned in exactly one place.
      uses: oven-sh/setup-bun@v2
    - name: Install dependencies
      shell: bash
      run: bun install