# Reusable Package Workflow
name: _Package

on:
  workflow_call:
    inputs:
      nightly:
        type: boolean
        default: false
        required: false
        description: 'Publish a nightly build'
    outputs:
      version:
        value: ${{ jobs.package.outputs.version }}
        description: 'Version of the packaged extension'
      nightly:
        value: ${{ jobs.package.outputs.nightly }}
        description: 'Whether the packaged extension is a nightly build'

permissions:
  contents: read

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download compiled extension from artifacts
        uses: actions/download-artifact@v8
        with:
          name: extension-dist
          path: dist

      - name: Download compiled lsp from artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: lspml-*
          merge-multiple: true
          path: resources

      - name: Make files executable
        shell: bash
        run: chmod a+x resources/lspml-*

      - name: Setup
        uses: ./.github/actions/setup

      - name: Patch package.json version
        if: ${{ inputs.nightly }}
        run: bun scripts/patch-package-version.ts

      - name: Read version from package.json
        id: version
        run: echo "version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"

      - name: Package stable extension
        if: ${{ !inputs.nightly }}
        run: bun vsce package --no-dependencies -o spml-vscode.vsix

      - name: Package pre-release extension
        if: ${{ inputs.nightly }}
        run: bun vsce package --no-dependencies --pre-release -o spml-vscode.vsix

      - name: Upload the artifact
        uses: actions/upload-artifact@v7
        with:
          name: spml-vscode.vsix
          path: spml-vscode.vsix

    outputs:
      version: ${{ steps.version.outputs.version }}
      nightly: ${{ inputs.nightly }}
